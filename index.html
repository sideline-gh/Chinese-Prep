<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hanzi Stroke Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#ECF0ED;
  --surface:#FAFBF9;
  --ink:#15231F;
  --muted:#54675F;
  --line:#CAD6D1;
  --grid:#9FB3AA;
  --accent:#0B6E5F;
  --accent-ink:#FFFFFF;
  --accent-soft:#D5EAE3;
  --pen:#C4411A;
  --overlay:rgba(12,22,19,.58);
  --font-hanzi:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --font-ui:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1614;--surface:#15211E;--ink:#E4EEEA;--muted:#93A9A1;--line:#2A3B36;--grid:#4B635B;
    --accent:#4DBFA8;--accent-ink:#06211B;--accent-soft:#1B3A33;--pen:#FF8F66;--overlay:rgba(0,0,0,.68);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1614;--surface:#15211E;--ink:#E4EEEA;--muted:#93A9A1;--line:#2A3B36;--grid:#4B635B;
  --accent:#4DBFA8;--accent-ink:#06211B;--accent-soft:#1B3A33;--pen:#FF8F66;--overlay:rgba(0,0,0,.68);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--font-ui);margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.page{max-width:68rem;margin:0 auto;padding-inline:max(16px,3vw);padding-block:1.25rem 4rem}

/* Masthead */
.masthead{display:flex;flex-wrap:wrap;gap:1.25rem 2.5rem;align-items:flex-end;justify-content:space-between;padding-block:1rem 1.5rem}
.masthead>*{min-width:0}
h1{margin:0;font:700 clamp(2rem,6vw,3rem)/1.05 var(--font-hanzi);text-wrap:balance}
.lede{margin:.65rem 0 0;color:var(--muted);max-width:34rem}
.progress{flex:0 1 18rem;min-width:min(100%,14rem)}
.progress-text{font-size:.95rem;color:var(--muted)}
.progress-text strong{color:var(--ink);font-size:1.25rem;font-variant-numeric:tabular-nums}
.bar{height:.5rem;margin-top:.5rem;background:var(--line);border-radius:99px;overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}

/* Toolbar */
.toolbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;gap:.6rem 1.25rem;align-items:center;justify-content:space-between;background:var(--bg);padding-block:.7rem;border-bottom:1px solid var(--line)}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--grid);border-radius:8px;overflow:hidden;background:var(--surface);max-width:100%}
.seg button{flex:1 1 auto;border:0;background:transparent;padding:.55rem .85rem;min-height:2.75rem;font-weight:600;border-right:1px solid var(--line);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg .ct{margin-left:.35rem;font-weight:400;opacity:.8;font-variant-numeric:tabular-nums}
.toggles{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{display:inline-flex;align-items:center;gap:.45rem;min-height:2.75rem;padding:0 .9rem;border:1px solid var(--grid);border-radius:8px;background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chip .box{width:1.05rem;height:1.05rem;border:1.5px solid var(--muted);border-radius:3px;display:grid;place-items:center;color:var(--accent-ink)}
.chip[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.chip .box svg{width:.8rem;height:.8rem;opacity:0}
.chip[aria-pressed="true"] .box svg{opacity:1}

/* Word list */
.lesson{margin-top:2rem}
.lesson-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:.25rem 1rem;border-bottom:2px solid var(--ink);padding-bottom:.4rem}
h2{margin:0;font:700 1.6rem/1.2 var(--font-hanzi)}
.meta{color:var(--muted);font-size:.95rem;font-variant-numeric:tabular-nums}
.words{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,23rem),1fr));column-gap:3rem}
.word{display:flex;align-items:center;gap:1rem;min-width:0;padding-block:.8rem;border-bottom:1px solid var(--line)}
.tiles{display:flex;gap:.35rem;flex:none}
.tile{position:relative;width:3.25rem;height:3.25rem;padding:0;display:grid;place-items:center;border:1.5px solid var(--grid);border-radius:4px;background:var(--surface);color:var(--ink);font:500 2rem/1 var(--font-hanzi)}
.tile::before,.tile::after{content:"";position:absolute;pointer-events:none}
.tile::before{left:0;right:0;top:50%;border-top:1px dashed var(--line)}
.tile::after{top:0;bottom:0;left:50%;border-left:1px dashed var(--line)}
.tile>span{position:relative;z-index:1}
.tile .ok{position:absolute;z-index:1;right:2px;bottom:2px;width:.9rem;height:.9rem;color:var(--accent);display:none}
.tile[data-known="true"]{border-color:var(--accent)}
.tile[data-known="true"] .ok{display:block}
.tile:hover{background:var(--accent-soft);border-color:var(--accent)}
.tile:active{transform:scale(.96)}
.ans{min-width:0;flex:1}
.say{flex:none;width:2.75rem;height:2.75rem;display:grid;place-items:center;padding:0;border:1px solid var(--line);border-radius:50%;background:var(--surface);color:var(--accent)}
.say:hover{background:var(--accent-soft);border-color:var(--accent)}
.say svg{width:1.3rem;height:1.3rem}
.note{position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;width:max-content;max-width:min(90vw,26rem);background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:8px;font-size:.95rem;text-align:center}
.py{font-weight:600;font-size:1.15rem;line-height:1.25;overflow-wrap:anywhere}
.mean{color:var(--muted);font-size:.95rem}
.empty{margin:1rem 0 0;color:var(--muted)}
.hide-answers .word:not(.rev) .ans{filter:blur(7px);user-select:none;cursor:pointer}

/* Stroke panel */
.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:var(--overlay)}
.panel{width:min(100%,28rem);max-height:100%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:.9rem 1.25rem 1.25rem;box-shadow:0 20px 50px rgba(0,0,0,.28)}
.p-head{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.p-count{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.icon-btn{width:2.75rem;height:2.75rem;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.icon-btn:hover{background:var(--accent-soft)}
.p-title{margin-top:.25rem;text-align:center}
.p-pinyin{font-weight:700;font-size:2rem;line-height:1.2}
.p-words{list-style:none;margin:.35rem 0 0;padding:0;color:var(--muted);font-size:.95rem}
.p-words li{display:flex;align-items:center;justify-content:center;gap:.5rem;min-height:2.75rem}
.p-words li>span:first-child{min-width:0;text-align:left}
.p-words .hz{font-family:var(--font-hanzi);color:var(--ink);font-weight:500;margin-right:.25rem}
.stage{position:relative;width:min(100%,19rem);aspect-ratio:1;margin:1rem auto 0;border:2px solid var(--accent);background:var(--surface);touch-action:none}
.guide{position:absolute;inset:0;width:100%;height:100%}
.guide line{stroke:var(--line);stroke-width:1.5;stroke-dasharray:6 5;vector-effect:non-scaling-stroke}
#writer{position:absolute;inset:0}
#writer svg{display:block;touch-action:none}
.p-status{min-height:1.5rem;margin:.6rem 0 0;text-align:center;color:var(--muted);font-size:.95rem}
.p-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;margin-top:.5rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:2.75rem;padding:0 1rem;border:1px solid var(--grid);border-radius:8px;background:var(--surface);font-weight:600}
.btn svg{width:1.1rem;height:1.1rem;flex:none}
.btn:hover:not(:disabled){background:var(--accent-soft);border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.1)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.steps{margin-top:1.25rem;padding-top:1rem;border-top:1px solid var(--line)}
.steps-head{display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
h3{margin:0;font-size:1rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.steps-hint{margin:.25rem 0 .75rem;color:var(--muted);font-size:.9rem}
.step-grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(4.25rem,1fr));gap:.5rem}
.step{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.step svg{display:block;width:100%;height:100%}
.step .g{stroke:var(--line);stroke-width:6;stroke-dasharray:26 20;fill:none}
.step .done{fill:var(--ink);fill-opacity:.38}
.step .cur{fill:var(--pen)}
.step .start{fill:var(--ink);stroke:var(--surface);stroke-width:12}
.step .n{position:absolute;left:4px;top:1px;font-size:.75rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.p-foot{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.25rem}
.p-foot #pKnown{flex:1 1 9rem}

@media (max-width:30rem){
  .seg{width:100%}
  .seg button{padding-inline:.4rem}
  .seg .ct{display:none}
  .word{gap:.75rem}
  .tile{width:3rem;height:3rem;font-size:1.85rem}
  .panel{padding-inline:1rem}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
  .tile:active{transform:none}
}
</style>
</head>
<body>

<div class="page">
  <header class="masthead">
    <div>
      <h1>Hanzi Stroke Book</h1>
      <p class="lede">Tap any character to watch it written stroke by stroke, then draw it yourself on the practice grid.</p>
    </div>
    <div class="progress">
      <div class="progress-text"><strong id="learned">0</strong> of <span id="total">0</span> characters learned</div>
      <div class="bar" id="bar" role="progressbar" aria-label="Characters learned" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="barFill"></span></div>
    </div>
  </header>

  <div class="toolbar">
    <div class="seg" id="tabs" role="group" aria-label="Show lesson"></div>
    <div class="toggles">
      <button type="button" class="chip" id="tHideLearned" aria-pressed="false"><span class="box"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Hide learned words</button>
      <button type="button" class="chip" id="tHideAnswers" aria-pressed="false"><span class="box"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Hide pinyin and meaning</button>
    </div>
  </div>

  <main id="list"></main>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="pPinyin">
    <div class="p-head">
      <span class="p-count" id="pCount"></span>
      <button type="button" class="icon-btn" id="pClose" aria-label="Close stroke order">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="p-title">
      <div class="p-pinyin" id="pPinyin"></div>
      <ul class="p-words" id="pWords"></ul>
    </div>
    <div class="stage" id="stage">
      <svg class="guide" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <line x1="0" y1="50" x2="100" y2="50"/><line x1="50" y1="0" x2="50" y2="100"/>
        <line x1="0" y1="0" x2="100" y2="100"/><line x1="100" y1="0" x2="0" y2="100"/>
      </svg>
      <div id="writer"></div>
    </div>
    <p class="p-status" id="pStatus" aria-live="polite"></p>
    <div class="p-actions">
      <button type="button" class="btn primary" id="pReplay"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>Replay</button>
      <button type="button" class="btn" id="pListen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path d="M15.5 9a4 4 0 010 6M18 6.5a7.5 7.5 0 010 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Listen</button>
      <button type="button" class="btn" id="pSlow" aria-pressed="false">Slow</button>
      <button type="button" class="btn" id="pPractice" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span id="pPracticeLabel">Practice writing</span></button>
    </div>
    <section class="steps" aria-labelledby="stepsHead">
      <div class="steps-head"><h3 id="stepsHead">Stroke order</h3><span class="meta" id="stepsCount"></span></div>
      <p class="steps-hint">The red stroke is the one added in that step. The dot marks where it starts.</p>
      <ol class="step-grid" id="stepGrid"></ol>
    </section>
    <div class="p-foot">
      <button type="button" class="btn" id="pPrev"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Previous</button>
      <button type="button" class="btn" id="pKnown" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="pKnownLabel">Mark as learned</span></button>
      <button type="button" class="btn" id="pNext">Next<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </div>
</div>

<p class="note" id="note" role="status" hidden></p>

<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7.2/dist/hanzi-writer.min.js"></script>

var $=function(id){return document.getElementById(id);};
var SVGNS='http://www.w3.org/2000/svg';
var CHECK='<svg class="ok" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var SPK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path d="M15.5 9a4 4 0 010 6M18 6.5a7.5 7.5 0 010 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
var reduceMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

var seq=[],seqIndex={};
LESSONS.forEach(function(L){L.words.forEach(function(w){Array.from(w.h).forEach(function(c){
  if(!(c in seqIndex)){seqIndex[c]=seq.length;seq.push({c:c,lesson:L.id,words:[]});}
  seq[seqIndex[c]].words.push(w);
});});});

var store={
  get:function(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}},
  set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
};
var known=new Set((store.get('hzbook.known',[])||[]).filter(function(c){return c in seqIndex;}));
var ui=Object.assign({tab:'1',hideLearned:false,hideAnswers:false},store.get('hzbook.ui',{})||{});
if(['1','2','3','4','5','6','all'].indexOf(ui.tab)<0)ui.tab='1';
function saveUi(){store.set('hzbook.ui',ui);}
function saveKnown(){store.set('hzbook.known',Array.from(known));}

var DATA_BASE='https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0.1/';
var cache=new Map();
function loadChar(ch){
  if(!cache.has(ch)){
    var p=import(DATA_BASE+encodeURIComponent(ch)+'.json/+esm').then(function(m){
      var d=(m.default&&m.default.strokes)?m.default:{strokes:m.strokes,medians:m.medians,radStrokes:m.radStrokes};
      if(!d||!d.strokes||!d.medians)throw new Error('Unexpected stroke data');
      return d;
    });
    p.catch(function(){cache.delete(ch);});
    cache.set(ch,p);
  }
  return cache.get(ch);
}

function allKnown(w){return Array.from(w.h).every(function(c){return known.has(c);});}

function wordRow(w){
  var li=document.createElement('li');li.className='word';
  var tiles=Array.from(w.h).map(function(c){
    return '<button type="button" class="tile" data-char="'+c+'" data-known="'+known.has(c)+'" aria-label="Stroke order for '+c+', '+(PY[c]||'')+'"><span>'+c+'</span>'+CHECK+'</button>';
  }).join('');
  li.innerHTML='<div class="tiles">'+tiles+'</div><div class="ans"><div class="py">'+w.p+'</div><div class="mean">'+w.m+'</div></div>'+
    '<button type="button" class="say" data-say="'+w.h+'" aria-label="Hear '+w.h+'">'+SPK+'</button>';
  return li;
}

var noteTimer;
function note(t){
  var n=$('note');n.textContent=t;n.hidden=false;
  clearTimeout(noteTimer);noteTimer=setTimeout(function(){n.hidden=true;},4500);
}
function zhVoice(){
  var vs=window.speechSynthesis.getVoices();
  return vs.find(function(v){return /^zh[-_]?CN/i.test(v.lang);})||vs.find(function(v){return /^zh/i.test(v.lang);})||null;
}
function speak(text){
  var ss=window.speechSynthesis;
  if(!ss||typeof SpeechSynthesisUtterance==='undefined'){note('This browser cannot play speech.');return;}
  var v=zhVoice();
  if(!v&&ss.getVoices().length){note('No Chinese voice found on this device.');return;}
  ss.cancel();
  var u=new SpeechSynthesisUtterance(text);
  u.lang='zh-CN';if(v)u.voice=v;u.rate=0.8;
  ss.speak(u);
}
if(window.speechSynthesis){window.speechSynthesis.getVoices();}

function renderList(){
  var root=$('list');root.textContent='';
  LESSONS.forEach(function(L){
    if(ui.tab!=='all'&&String(L.id)!==ui.tab)return;
    var words=L.words.filter(function(w){return !(ui.hideLearned&&allKnown(w));});
    var sec=document.createElement('section');sec.className='lesson';
    var meta=ui.hideLearned?words.length+' of '+L.words.length+' words left':L.words.length+' words';
    sec.innerHTML='<div class="lesson-head"><h2>Lesson '+L.id+'</h2><span class="meta">'+meta+'</span></div>';
    var ul=document.createElement('ul');ul.className='words';
    words.forEach(function(w){ul.appendChild(wordRow(w));});
    sec.appendChild(ul);
    root.appendChild(sec);
  });
  applyAnswerMode();
}

function applyAnswerMode(){
  document.documentElement.classList.toggle('hide-answers',ui.hideAnswers);
}

function renderTabs(){
  var tabs=$('tabs');tabs.textContent='';
  var items=LESSONS.map(function(L){return {k:String(L.id),label:'Lesson '+L.id,n:L.words.length};});
  items.push({k:'all',label:'All',n:LESSONS.reduce(function(s,L){return s+L.words.length;},0)});
  items.forEach(function(it){
    var b=document.createElement('button');b.type='button';b.dataset.tab=it.k;
    b.setAttribute('aria-pressed',String(ui.tab===it.k));
    b.innerHTML=it.label+'<span class="ct">'+it.n+'</span>';
    tabs.appendChild(b);
  });
}

function updateProgress(){
  var n=known.size,t=seq.length;
  $('learned').textContent=n;$('total').textContent=t;
  var pct=t?Math.round(n/t*100):0;
  $('barFill').style.width=pct+'%';$('bar').setAttribute('aria-valuenow',String(pct));
}
function updateTiles(){
  document.querySelectorAll('.tile').forEach(function(t){t.dataset.known=String(known.has(t.dataset.char));});
}

var cur=-1,writer=null,slow=false,quizzing=false,fillToken=0,curData=null,opener=null,dirty=false;

function setStatus(t){$('pStatus').textContent=t||'';}
function setPracticeUI(on){
  quizzing=on;
  $('pPractice').setAttribute('aria-pressed',String(on));
  $('pPracticeLabel').textContent=on?'Stop practice':'Practice writing';
}

function stepItem(data,i){
  var li=document.createElement('li');li.className='step';
  var svg=document.createElementNS(SVGNS,'svg');
  svg.setAttribute('viewBox','0 0 1024 1024');svg.setAttribute('aria-hidden','true');
  var guide=document.createElementNS(SVGNS,'path');
  guide.setAttribute('d','M0 0L1024 1024M1024 0L0 1024M512 0V1024M0 512H1024');guide.setAttribute('class','g');
  svg.appendChild(guide);
  var g=document.createElementNS(SVGNS,'g');g.setAttribute('transform','translate(0,900) scale(1,-1)');
  for(var k=0;k<=i;k++){
    var p=document.createElementNS(SVGNS,'path');
    p.setAttribute('d',data.strokes[k]);p.setAttribute('class',k===i?'cur':'done');g.appendChild(p);
  }
  svg.appendChild(g);li.appendChild(svg);
  return li;
}
function renderSteps(data){
  var grid=$('stepGrid');grid.textContent='';
  data.strokes.forEach(function(_,i){grid.appendChild(stepItem(data,i));});
  $('stepsCount').textContent=data.strokes.length+' strokes';
}

function mountWriter(mode){
  var host=$('writer');host.textContent='';writer=null;
  setPracticeUI(mode==='quiz');
  if(typeof HanziWriter==='undefined')return;
  var c=seq[cur].c,token=fillToken;
  var size=Math.round($('stage').clientWidth)||280;
  var cs=getComputedStyle(document.documentElement);
  var col=function(n){return cs.getPropertyValue(n).trim();};
  writer=HanziWriter.create(host,c,{
    width:size,height:size,padding:Math.round(size*0.07),
    showCharacter:mode==='rest',showOutline:true,
    strokeColor:col('--ink'),outlineColor:col('--grid'),highlightColor:col('--pen'),drawingColor:col('--ink'),
    drawingWidth:Math.max(6,Math.round(size/28)),
    charDataLoader:function(ch,onLoad,onError){loadChar(ch).then(onLoad,onError);}
  });
  if(mode==='play'){
    writer.animateCharacter();
  }else if(mode==='quiz'){
    writer.quiz();
  }
}

function updateKnownBtn(){
  var on=known.has(seq[cur].c);
  $('pKnown').setAttribute('aria-pressed',String(on));
  $('pKnownLabel').textContent=on?'Learned':'Mark as learned';
}

function fillPanel(mode){
  var e=seq[cur],token=++fillToken;
  curData=null;
  $('pCount').textContent='Lesson '+e.lesson+' · '+(cur+1)+' of '+seq.length;
  $('pPinyin').textContent=PY[e.c]||'';
  $('pWords').innerHTML=e.words.map(function(w){
    return '<li><span><span class="hz">'+w.h+'</span> '+w.p+' · '+w.m+'</span></li>';
  }).join('');
  updateKnownBtn();
  loadChar(e.c).then(function(data){
    if(token!==fillToken)return;
    curData=data;renderSteps(data);mountWriter(mode);
  });
}

function openPanel(i,from){
  cur=i;opener=from||null;
  $('overlay').hidden=false;
  document.body.style.overflow='hidden';
  fillPanel(reduceMotion?'rest':'play');
}
function closePanel(){
  if(cur<0)return;
  fillToken++;writer=null;$('writer').textContent='';
  $('overlay').hidden=true;document.body.style.overflow='';
  cur=-1;
}

$('list').addEventListener('click',function(e){
  var tile=e.target.closest('.tile');
  if(tile){openPanel(seqIndex[tile.dataset.char],tile);return;}
});
$('tabs').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  ui.tab=b.dataset.tab;saveUi();renderTabs();renderList();
});
$('pClose').addEventListener('click',closePanel);
$('overlay').addEventListener('click',function(e){if(e.target===$('overlay'))closePanel();});
$('pReplay').addEventListener('click',function(){mountWriter('play');});
$('pListen').addEventListener('click',function(){if(cur>=0)speak(seq[cur].c);});
$('pKnown').addEventListener('click',function(){
  var c=seq[cur].c;
  if(known.has(c))known.delete(c);else known.add(c);
  saveKnown();updateKnownBtn();updateTiles();updateProgress();
});
$('pPrev').addEventListener('click',function(){if(cur>0){cur--;fillPanel('play');}});
$('pNext').addEventListener('click',function(){if(cur<seq.length-1){cur++;fillPanel('play');}});

renderTabs();
renderList();
updateProgress();
})();
</script>
